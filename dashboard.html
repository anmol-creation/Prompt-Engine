<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - PromptoEngine</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/feedback.css">
</head>
<body class="dark-mode">
    <header id="main-header"></header>

    <main class="container" id="dashboard-container">
        <!-- Profile Card -->
        <div class="profile-card">
            <img id="dash-avatar" src="" alt="Profile Picture">
            <h2 id="dash-name">Loading...</h2>
            <p id="dash-email">user@example.com</p>
            <button id="dash-logout-btn" class="logout-btn pill-btn-logout">Logout</button>
        </div>

        <!-- Tabs -->
        <div class="dashboard-tabs">
            <button class="tab-btn active" data-tab="saved-prompts">Saved Prompts</button>
            <button class="tab-btn" data-tab="history">My History</button>
            <button class="tab-btn" data-tab="contributions">My Contributions</button>
        </div>

        <!-- Post to Gallery Modal -->
        <div id="post-modal" class="modal hidden">
            <div class="modal-content post-modal-content">
                <span class="close-modal" id="close-post-modal">&times;</span>
                <h3>Post to Gallery</h3>

                <div class="form-group">
                    <label>Prompt Preview</label>
                    <textarea id="post-prompt-preview" readonly></textarea>
                </div>

                <div class="form-group">
                    <label>Upload Image Result</label>
                    <input type="file" id="post-image-upload" accept="image/*">
                    <div id="image-preview-container" class="hidden">
                        <img id="image-preview" src="" alt="Preview">
                    </div>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="post-category">
                        <option value="Realistic">Realistic</option>
                        <option value="Anime">Anime</option>
                        <option value="Car">Car</option>
                        <option value="Portrait">Portrait</option>
                        <option value="Architecture">Architecture</option>
                        <option value="Nature">Nature</option>
                        <option value="Cyberpunk">Cyberpunk</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button id="post-submit-btn" class="primary-btn">Publish to Gallery</button>
            </div>
        </div>

        <!-- Content Area -->
        <div id="dash-content" class="content-area">
            <div class="empty-state">
                <p>You haven't saved any prompts yet.</p>
            </div>
        </div>
    </main>

    <footer id="main-footer"></footer>

    <!-- Layout script injected before other scripts that rely on DOM -->
    <script src="assets/js/layout.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/feedback.js"></script>
    <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
