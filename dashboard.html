<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - PromptoEngine</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/feedback.css">
</head>
<body class="dark-mode">
    <header>
        <div class="container header-content">
            <a href="pages/home/home.html" class="logo-link"><h1>Prompt<span class="brand-o">O</span>Engine<span class="brand-domain">.ac</span></h1></a>
            <div class="header-right">
                <button id="theme-toggle" aria-label="Toggle Dark Mode">
                    <span class="icon">☀️</span>
                    <span class="text">Light Mode</span>
                </button>

                <!-- Authentication UI -->
                <button id="login-btn" class="auth-btn">
                    <svg class="google-icon" viewBox="0 0 48 48" width="18px" height="18px">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Sign in
                </button>

                <div id="user-profile" class="user-profile hidden">
                    <img id="user-avatar" src="" alt="User" class="avatar">
                    <div id="profile-dropdown" class="profile-dropdown hidden">
                        <a href="dashboard.html" class="dropdown-item">My Dashboard</a>
                        <button id="logout-btn-header" class="logout-btn dropdown-item">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container" id="dashboard-container">
        <!-- Profile Card -->
        <div class="profile-card">
            <img id="dash-avatar" src="" alt="Profile Picture">
            <h2 id="dash-name">Loading...</h2>
            <p id="dash-email">user@example.com</p>
            <button id="dash-logout-btn" class="logout-btn pill-btn-logout">Logout</button>
        </div>

        <!-- Tabs -->
        <div class="dashboard-tabs">
            <button class="tab-btn active" data-tab="saved-prompts">Saved Prompts</button>
            <button class="tab-btn" data-tab="contributions">My Contributions</button>
        </div>

        <!-- Content Area -->
        <div id="dash-content" class="content-area">
            <div class="empty-state">
                <p>You haven't saved any prompts yet.</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-branding">
                <p>&copy; 2025 AnmolCreation. Designed for thinking, not guessing.</p>
            </div>

            <div class="footer-feedback">
                <h4>Rate Your Experience <span class="ac-trigger" style="opacity: 0.1; cursor: default;">.ac</span></h4>
                <div class="feedback-form" id="feedback-form">
                    <div class="star-rating" id="star-rating">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>

                    <div class="feedback-details" id="feedback-details" style="display: none;">
                        <div class="feedback-category">
                            <label><input type="radio" name="feedback-category" value="Report Bug"> Bug</label>
                            <label><input type="radio" name="feedback-category" value="Feature Request"> Feature</label>
                            <label><input type="radio" name="feedback-category" value="Other" checked> Other</label>
                        </div>
                        <textarea id="feedback-message" placeholder="Tell us more..."></textarea>
                        <button id="feedback-submit" disabled>Send Feedback</button>
                    </div>
                </div>
                <div id="feedback-success" style="display: none;">
                    <p>Thank you for your feedback!</p>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/feedback.js"></script>
    <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
