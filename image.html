<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Prompt Builder - PromtoEngine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light-mode">
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo-link"><h1>PromtoEngine</h1></a>
            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                <span class="icon">🌙</span>
                <span class="text">Dark Mode</span>
            </button>
        </div>
    </header>

    <main class="container">
        <!-- Page Title & Mode -->
        <div class="builder-header">
            <h2>Image Prompt Builder</h2>
            <div class="mode-toggle-container">
                <div class="mode-slider">
                    <div class="mode-option active" data-mode="default">Default</div>
                    <div class="mode-option" data-mode="advanced">Advanced</div>
                    <div class="mode-option" data-mode="pro">Pro</div>
                </div>
                <div class="mode-knob"></div>
            </div>
        </div>

        <!-- Prompt Builder UI -->
        <section class="builder-line-container">
            <div id="builder-rows">
                <!-- Rows will be injected here or the first one is present -->
                <div class="builder-row" data-row-index="0">
                    <span class="builder-static">Create Prompt</span>

                    <select class="builder-dropdown category-select" aria-label="Select Category">
                        <option value="">Category</option>
                        <option value="Background">Background</option>
                        <option value="Face">Face</option>
                        <option value="Object / Subject">Object / Subject</option>
                        <option value="Color & Light">Color & Light</option>
                        <option value="Style">Style</option>
                        <option value="Quality">Quality</option>
                    </select>

                    <select class="builder-dropdown action-select hidden" aria-label="Select Action">
                        <option value="">Action</option>
                    </select>

                    <span class="helper-text hidden"></span>

                    <div class="intensity-wrapper hidden">
                        <label>Intensity: <span class="intensity-value">5</span></label>
                        <input type="range" min="1" max="10" value="5" class="intensity-slider">
                    </div>
                </div>
            </div>

            <button id="add-row-btn" class="add-btn" aria-label="Add field">+</button>
        </section>

        <!-- Action Area -->
        <div class="action-area">
            <div class="language-selector-wrapper">
                <label for="language-select">Output Language:</label>
                <select id="language-select" class="language-dropdown">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Hinglish">Hinglish</option>
                </select>
            </div>
            <button id="create-prompt-btn" class="create-btn">Create Prompt</button>
        </div>

        <!-- Output Area -->
        <section class="output-area">
            <div class="output-content">
                <p id="prompt-output">Your generated prompt will appear here...</p>
            </div>
            <button id="copy-btn" class="copy-btn hidden" aria-label="Copy Prompt">Copy</button>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 AnmolCreation. Designed for thinking, not guessing.</p>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
