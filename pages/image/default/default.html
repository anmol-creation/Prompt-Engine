<div class="builder-header">
    <!-- Removed H2 as it is now in parent -->
    <div class="mode-toggle-container">
        <div class="mode-slider">
            <div class="mode-option active" data-mode="default">Default</div>
            <div class="mode-option" data-mode="advanced">Advanced</div>
            <div class="mode-option" data-mode="pro">Pro</div>
        </div>
        <div class="mode-knob"></div>
    </div>
</div>

<!-- Prompt Builder UI -->
<section class="builder-line-container">
    <div id="builder-rows">
        <!-- Rows will be injected here or the first one is present -->
        <div class="builder-row" data-row-index="0">
            <span class="builder-static">Create Prompt</span>

            <!-- Converted to Custom Dropdown Structure -->
            <div class="custom-dropdown category-dropdown" data-name="category"></div>
            <div class="custom-dropdown action-dropdown hidden" data-name="action"></div>

            <!-- Legacy inputs for Logic Compatibility -->
            <select class="category-select hidden" style="display:none;"></select>
            <select class="action-select hidden" style="display:none;"></select>

            <span class="helper-text hidden"></span>

            <div class="intensity-wrapper hidden">
                <label>Intensity: <span class="intensity-value">5</span></label>
                <input type="range" min="1" max="10" value="5" class="intensity-slider">
            </div>
        </div>
    </div>

    <button id="add-row-btn" class="add-btn" aria-label="Add field">+</button>
</section>

<!-- Action Area -->
<div class="action-area">
    <div class="language-selector-wrapper">
        <label for="language-select">Output Language:</label>
        <select id="language-select" class="language-dropdown">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Hinglish">Hinglish</option>
        </select>
    </div>
    <button id="create-prompt-btn" class="create-btn">Create Prompt</button>
</div>

<!-- Output Area -->
<section class="output-area">
    <div class="output-content">
        <p id="prompt-output">Your generated prompt will appear here...</p>
    </div>
    <button id="copy-btn" class="copy-btn hidden" aria-label="Copy Prompt">Copy</button>
</section>
