<div class="simple-builder-container">

    <!-- Soft Preview Area -->
    <div class="soft-preview-area">
        <div class="preview-overlay">
            <h3>Soft Mode helps you keep things simple.</h3>
            <p>Select less. Let AI decide the rest.</p>
        </div>
        <div class="preview-background-blur"></div>
    </div>

    <!-- Builder Card -->
    <section class="builder-line-container-simple">
        <!-- Fix Stack Container (New) -->
        <div id="simple-fix-stack-container" class="fix-stack-container hidden">
            <!-- Dynamically populated fix items -->
        </div>

        <div class="simple-builder-row">
            <span class="static-text">I want to...</span>

            <!-- Main Category Dropdown -->
            <div class="custom-dropdown" id="simple-main-category"></div>

            <!-- Sub Category Dropdown 1 -->
            <div class="custom-dropdown hidden" id="simple-sub-category"></div>

            <!-- Sub Category Dropdown 2 (Third Level) -->
            <div class="custom-dropdown hidden" id="simple-sub-category-2"></div>

            <!-- Sub Category Dropdown 3 (Fourth Level) -->
            <div class="custom-dropdown hidden" id="simple-sub-category-3"></div>

            <!-- Plus Button for Fix Image -->
            <button id="simple-fix-plus-btn" class="fix-plus-btn hidden" title="Add another fix">+</button>
        </div>

        <!-- Dynamic Inputs (Hidden by default) -->
        <div id="simple-dynamic-inputs" class="dynamic-inputs hidden">
            <input type="text" id="simple-text-input" class="custom-input hidden" placeholder="Type here...">
            <!-- Image Upload Removed -->
        </div>

        <!-- Fan Moment Optional Options (Hidden by default) -->
        <div id="simple-fan-moment-options" class="optional-options-container hidden">
            <div class="optional-title">Optional: Customize your moment (or skip for AI default)</div>
            <div class="optional-grid">
                <div class="optional-item">
                    <label>Place</label>
                    <div class="custom-dropdown" id="opt-place"></div>
                </div>
                <div class="optional-item">
                    <label>Outfit</label>
                    <div class="custom-dropdown" id="opt-outfit"></div>
                </div>
                <div class="optional-item">
                    <label>Mood</label>
                    <div class="custom-dropdown" id="opt-mood"></div>
                </div>
                <div class="optional-item">
                    <label>Framing</label>
                    <div class="custom-dropdown" id="opt-framing"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Action Area -->
    <div class="action-area">
        <div class="language-selector-wrapper">
            <label>Output Language:</label>
            <div class="custom-dropdown" id="simple-language-select" style="min-width: 120px;"></div>
        </div>
        <button id="simple-create-btn" class="create-btn">Create Prompt</button>
    </div>

    <!-- Output Area -->
    <div id="simple-output-container" class="output-area">
        <div class="output-content">
            <p id="simple-final-prompt">Your generated prompt will appear here...</p>
        </div>
        <button id="simple-copy-btn" class="copy-btn hidden">Copy</button>
    </div>

    <!-- Visual Guide Container -->
    <!-- Will be populated by JS -->
    <div id="simple-visual-guide-container" class="visual-guide-container hidden"></div>
</div>
