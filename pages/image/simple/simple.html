<div class="simple-builder-container">
    <h2>Simple Mode</h2>
    <p class="simple-mode-desc">Stop describing. Start selecting.</p>

    <!-- Builder Row -->
    <div class="simple-builder-row">
        <span class="static-text">Create Prompt</span>

        <!-- Main Category Dropdown -->
        <div class="custom-dropdown" id="simple-main-category">
            <div class="dropdown-trigger">
                <span class="selected-text">Select Category</span>
                <span class="arrow">▼</span>
            </div>
            <div class="dropdown-menu hidden">
                <!-- Items populated via JS -->
            </div>
        </div>

        <span class="separator">→</span>

        <!-- Sub Category Dropdown -->
        <div class="custom-dropdown hidden" id="simple-sub-category">
            <div class="dropdown-trigger">
                <span class="selected-text">Select Option</span>
                <span class="arrow">▼</span>
            </div>
            <div class="dropdown-menu hidden">
                <!-- Items populated via JS -->
            </div>
        </div>
    </div>

    <!-- Output Area -->
    <div id="simple-output-container" class="output-container hidden">
        <div class="prompt-box">
            <p id="simple-final-prompt"></p>
        </div>
        <button id="simple-copy-btn" class="copy-btn">Copy</button>
    </div>

    <!-- Visual Guide Container (Placeholder) -->
    <div id="simple-visual-guide-container" class="visual-guide-container hidden">
        <h3>Visual Guide</h3>
        <p>Visual preview would appear here.</p>
    </div>
</div>
