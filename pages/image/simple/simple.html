<div class="simple-mode-container">
    <h2>Simple Mode</h2>
    <p class="simple-mode-desc">Stop describing. Start selecting.</p>

    <div class="simple-categories-grid">
        <!-- Categories will be injected here or hardcoded -->
        <div class="simple-category-card" data-category="Fix Background">
            <h3>Fix Background</h3>
            <button class="simple-action-btn" data-action="Blur Background">Blur Background</button>
        </div>
        <div class="simple-category-card" data-category="Make Photo Clear">
            <h3>Make Photo Clear</h3>
            <button class="simple-action-btn" data-action="Remove Blur">Remove Blur</button>
        </div>
        <div class="simple-category-card" data-category="Improve Face">
            <h3>Improve Face</h3>
            <button class="simple-action-btn" data-action="Natural Enhance">Natural Enhance</button>
        </div>
        <div class="simple-category-card" data-category="Profile Photo Ready">
            <h3>Profile Photo Ready</h3>
            <button class="simple-action-btn" data-action="Professional Look">Professional Look</button>
        </div>
        <div class="simple-category-card" data-category="Change Style">
            <h3>Change Style</h3>
            <button class="simple-action-btn" data-action="Cartoon / Art Style">Cartoon / Art Style</button>
        </div>
        <div class="simple-category-card" data-category="Restore Old Photo">
            <h3>Restore Old Photo</h3>
            <button class="simple-action-btn" data-action="Auto Restore">Auto Restore</button>
        </div>
        <div class="simple-category-card" data-category="Product Photo">
            <h3>Product Photo</h3>
            <button class="simple-action-btn" data-action="Clean Product Look">Clean Product Look</button>
        </div>
        <div class="simple-category-card" data-category="Social Media Image">
            <h3>Social Media Image</h3>
            <button class="simple-action-btn" data-action="Auto Post Design">Auto Post Design</button>
        </div>
    </div>

    <!-- Output Area (Minimal) -->
    <div class="simple-output-area hidden">
        <p id="simple-prompt-output">Thinking...</p>
        <button id="simple-copy-btn">Copy</button>
    </div>
</div>
