<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Tracking Code -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3565X5KNFD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3565X5KNFD');
    </script>
    <title>Readymade Prompt Library</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/feedback.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <!-- Global Header -->
    <header id="main-header"></header>

    <!-- Gallery Specific Title Section -->
    <section class="gallery-header">
        <h1>Explore Prompts</h1>
        <div id="results-count" class="subtitle">About 0 Results</div>

        <!-- Search Bar -->
        <div class="search-wrapper">
            <div class="search-container">
                <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <input type="text" id="gallery-search" placeholder="Search prompts..." autocomplete="off">
                <button id="search-btn">Search</button>
            </div>
        </div>

        <div class="subtitle">Click an image to copy the prompt</div>

        <!-- Filter Controls -->
        <div class="gallery-controls">
            <div class="control-group">
                <label for="sort-select">Sort By:</label>
                <select id="sort-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
            <div class="control-group">
                <label for="subject-select">Subject:</label>
                <select id="subject-select">
                    <option value="all">All Subjects</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="couple">Couple</option>
                    <option value="kids">Kids</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Navigation Tabs -->
    <nav id="tabs-container" class="tabs-container">
        <!-- Tabs injected by script.js -->
    </nav>

    <!-- Gallery Grid -->
    <main id="gallery-grid">
        <!-- Gallery items injected by script.js -->
    </main>

    <!-- Toast Notification -->
    <div id="toast">Prompt Copied! ✅</div>

    <!-- Global Footer -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="../../assets/js/layout.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="../../assets/js/feedback.js"></script>

</body>
</html>
