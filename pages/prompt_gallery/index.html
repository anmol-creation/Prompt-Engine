<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover production-ready AI prompts for image generation.">
  <title>Prompt Gallery · PromptoEngine</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/feedback.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
  <header id="main-header"></header>
  <main class="gallery-page">
    <section class="gallery-hero" aria-labelledby="gallery-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span> Curated prompt intelligence</div>
      <div class="hero-heading"><div><h1 id="gallery-title">Find the prompt<br><em>behind the magic.</em></h1><p>Explore a living library of cinematic recipes, visual directions, and creative starting points.</p></div><div class="hero-stat"><strong id="results-count">0</strong><span>prompts indexed</span></div></div>
      <div class="search-container"><span class="search-icon" aria-hidden="true">⌕</span><input type="search" id="gallery-search" placeholder="Search 'Cyberpunk', 'Cinematic', 'Hyper Realistic', 'Portrait'..." autocomplete="off" aria-label="Search prompts"><kbd>⌘ K</kbd><button id="search-btn">Search <span>↗</span></button></div>
      <div class="filters" aria-label="Prompt filters">
        <label>Sort By<select id="sort-select"><option value="newest">Newest First</option><option value="oldest">Oldest First</option></select></label>
        <label>Subject<select id="subject-select"><option value="all">All Subjects</option><option value="male">Male</option><option value="female">Female</option><option value="couple">Couple</option><option value="kids">Kids</option></select></label>
        <label>Engine<select id="engine-select"><option value="all">All Engines</option><option value="midjourney">Midjourney v6.1</option><option value="flux">Flux.1</option><option value="stable">Stable Diffusion 3.5</option><option value="dalle">DALL·E 3</option></select></label>
        <button id="theme-toggle-gallery" class="theme-switch" type="button" aria-label="Toggle theme">◐ <span>Theme</span></button>
      </div>
    </section>
    <nav id="tabs-container" class="tabs-container" aria-label="Prompt categories"></nav>
    <section class="gallery-section"><div id="gallery-grid" aria-live="polite"></div><div id="pagination" class="pagination"></div></section>
  </main>
  <div id="toast" role="status">Prompt copied</div>
  <footer id="main-footer"></footer>
  <nav class="mobile-nav" aria-label="Mobile navigation"><a href="../../pages/home/home.html">⌂<span>Home</span></a><a class="active" href="#gallery-grid">▦<span>Gallery</span></a><a class="create" href="#"><b>+</b><span>Create</span></a><a href="#">◈<span>Tools</span></a><a href="#tabs-container">⌕<span>Explore</span></a></nav>
  <script src="../../assets/js/layout.js"></script><script type="module" src="script.js"></script><script type="module" src="../../assets/js/feedback.js"></script>
</body>
</html>
