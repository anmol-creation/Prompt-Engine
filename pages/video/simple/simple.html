<div class="simple-mode-container">
    <div class="welcome-section">
        <h3>Simple Mode</h3>
        <p>Select your video elements. No complex settings.</p>
    </div>

    <!-- Dropdown Container -->
    <div id="simple-dropdown-container" class="dropdown-container">
        <!-- Main Category Dropdown -->
        <div class="dropdown-wrapper level-0">
            <select id="simple-category-select" class="custom-dropdown">
                <option value="">Select Category</option>
            </select>
        </div>
        <!-- Dynamic Levels -->
        <div id="simple-dynamic-levels"></div>
    </div>

    <!-- Add Button Container -->
    <div id="simple-add-btn-container" class="add-btn-container hidden">
        <button id="simple-add-btn" class="add-btn">[Add]</button>
    </div>

    <!-- Active Stack (Visual Feedback) -->
    <div id="simple-active-stack" class="active-stack">
        <!-- Stack items will appear here -->
    </div>
</div>
