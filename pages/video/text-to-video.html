<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text To Video - PromptoEngine</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="video.css">
    <style>
        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow-color);
            margin-bottom: 30px;
        }

        /* Chip Container Styles */
        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 40px; /* To prevent jumping when empty */
        }

        .chip {
            background-color: var(--toggle-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        .chip-close {
            cursor: pointer;
            color: var(--danger-color, #e74c3c);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .chip-close:hover {
            transform: scale(1.2);
        }

        /* Selection Row Styles */
        .selection-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .selection-row select {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        .add-btn {
            background-color: var(--success-color, #28a745);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.25);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(40, 167, 69, 0.35);
            background-color: #218838;
        }

        .add-btn:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }


        .generate-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            transition: opacity 0.2s;
        }

        .generate-btn:hover {
            opacity: 0.9;
        }

        .result-container {
            margin-top: 30px;
            position: relative;
        }

        .result-textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            resize: vertical;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--toggle-bg);
            color: var(--text-color);
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--border-color);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="dark-mode">
    <header id="main-header"></header>
    <main class="container">
        <a href="video.html" class="back-link">&larr; Back to Video Menu</a>
        <h2>Text To Video</h2>
        <p style="margin-bottom: 20px;">Stop describing. Start selecting. Build your video prompt by choosing the elements below.</p>

        <div class="form-container">
            <!-- Chip Container -->
            <div id="t2v-chip-container" class="chip-container"></div>

            <!-- Selection Row -->
            <div class="selection-row">
                <select id="t2v-level1">
                    <option value="" disabled selected>Select a category...</option>
                    <option value="Subject">Subject</option>
                    <option value="Customization">Customization</option>
                    <option value="Action">Action / Motion</option>
                    <option value="Background">Background</option>
                    <option value="Camera Shot">Camera Shot</option>
                    <option value="Camera Movement">Camera Movement</option>
                    <option value="Lighting">Lighting</option>
                    <option value="Effects">Effects (VFX)</option>
                    <option value="Art Style">Art Style</option>
                </select>

                <select id="t2v-level2" disabled>
                    <option value="" disabled selected>Select option...</option>
                </select>

                <select id="t2v-level3" disabled style="display:none;">
                    <option value="" disabled selected>Select specific item...</option>
                </select>

                <button id="t2v-add-btn" class="add-btn" disabled>Add</button>
            </div>

            <button class="generate-btn" id="generate-btn">Generate Video Prompt</button>

            <div class="result-container">
                <textarea id="final-prompt" class="result-textarea" readonly placeholder="Your generated prompt will appear here..."></textarea>
                <button class="copy-btn" id="copy-btn">Copy Prompt</button>
            </div>
        </div>
    </main>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/text-to-video.js"></script>
</body>
</html>
