<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text To Video - PromptoEngine</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="video.css">
    <style>
        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow-color);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        .form-group input::placeholder {
            color: var(--footer-text);
        }

        .generate-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            transition: opacity 0.2s;
        }

        .generate-btn:hover {
            opacity: 0.9;
        }

        .result-container {
            margin-top: 30px;
            position: relative;
        }

        .result-textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            resize: vertical;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--toggle-bg);
            color: var(--text-color);
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--border-color);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="dark-mode">
    <header id="main-header"></header>
    <main class="container">
        <a href="video.html" class="back-link">&larr; Back to Video Menu</a>
        <h2>Text To Video</h2>
        <p style="margin-bottom: 20px;">Stop describing. Start selecting. Build your video prompt by choosing the elements below.</p>

        <div class="form-container">
            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject">
                    <option value="" disabled selected>Select a subject...</option>
                    <option value="Man">Man</option>
                    <option value="Woman">Woman</option>
                    <option value="Golden Retriever">Golden Retriever</option>
                    <option value="Futuristic Car">Futuristic Car</option>
                    <option value="Robot">Robot</option>
                </select>
            </div>

            <div class="form-group">
                <label for="customization">Customization</label>
                <select id="customization">
                    <option value="" disabled selected>Select customization...</option>
                    <option value="Casual clothes">Casual clothes</option>
                    <option value="Cyberpunk gear">Cyberpunk gear</option>
                    <option value="Business suit">Business suit</option>
                    <option value="Astronaut suit">Astronaut suit</option>
                </select>
            </div>

            <div class="form-group">
                <label for="action">Action / Motion</label>
                <select id="action">
                    <option value="" disabled selected>Select an action...</option>
                    <option value="Walking slowly">Walking slowly</option>
                    <option value="Running fast">Running fast</option>
                    <option value="Standing still">Standing still</option>
                    <option value="Flying">Flying</option>
                    <option value="Looking at the camera">Looking at the camera</option>
                </select>
            </div>

            <div class="form-group">
                <label for="background">Background</label>
                <select id="background">
                    <option value="" disabled selected>Select a background...</option>
                    <option value="Busy cyberpunk street">Busy cyberpunk street</option>
                    <option value="Misty dark forest">Misty dark forest</option>
                    <option value="Modern office">Modern office</option>
                    <option value="Neon-lit alley">Neon-lit alley</option>
                </select>
            </div>

            <div class="form-group">
                <label for="camera-shot">Camera Shot</label>
                <select id="camera-shot">
                    <option value="" disabled selected>Select a camera shot...</option>
                    <option value="Extreme Close-up">Extreme Close-up</option>
                    <option value="Medium Shot">Medium Shot</option>
                    <option value="Wide Angle">Wide Angle</option>
                    <option value="Drone Shot">Drone Shot</option>
                </select>
            </div>

            <div class="form-group">
                <label for="camera-movement">Camera Movement</label>
                <select id="camera-movement">
                    <option value="" disabled selected>Select camera movement...</option>
                    <option value="Static/Locked">Static/Locked</option>
                    <option value="Pan Left">Pan Left</option>
                    <option value="Slow Zoom-in">Slow Zoom-in</option>
                    <option value="Fast Zoom-out">Fast Zoom-out</option>
                    <option value="Orbiting subject">Orbiting subject</option>
                </select>
            </div>

            <div class="form-group">
                <label for="lighting">Lighting</label>
                <select id="lighting">
                    <option value="" disabled selected>Select lighting...</option>
                    <option value="Golden hour">Golden hour</option>
                    <option value="Cinematic dark">Cinematic dark</option>
                    <option value="Neon lighting">Neon lighting</option>
                    <option value="Volumetric light rays">Volumetric light rays</option>
                </select>
            </div>

            <div class="form-group">
                <label for="effects">Effects (VFX)</label>
                <select id="effects">
                    <option value="" disabled selected>Select an effect...</option>
                    <option value="None">None</option>
                    <option value="Heavy rain">Heavy rain</option>
                    <option value="Glowing embers">Glowing embers</option>
                    <option value="Cinematic slow-motion">Cinematic slow-motion</option>
                    <option value="Motion blur">Motion blur</option>
                </select>
            </div>

            <div class="form-group">
                <label for="art-style">Art Style</label>
                <select id="art-style">
                    <option value="" disabled selected>Select an art style...</option>
                    <option value="Photorealistic">Photorealistic</option>
                    <option value="3D Pixar Style">3D Pixar Style</option>
                    <option value="Anime/Manga">Anime/Manga</option>
                    <option value="Cinematic Film">Cinematic Film</option>
                </select>
            </div>

            <button class="generate-btn" id="generate-btn">Generate Video Prompt</button>

            <div class="result-container">
                <textarea id="final-prompt" class="result-textarea" readonly placeholder="Your generated prompt will appear here..."></textarea>
                <button class="copy-btn" id="copy-btn">Copy Prompt</button>
            </div>
        </div>
    </main>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/text-to-video.js"></script>
</body>
</html>
