<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Tracking Code -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3565X5KNFD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3565X5KNFD');
    </script>
    <title>Video Prompt Builder - PromptoEngine</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/feedback.css">
    <link rel="stylesheet" href="video.css">
</head>
<body class="dark-mode">
    <header>
        <div class="container header-content">
            <a href="../home/home.html" class="logo-link"><h1>Prompt<span class="brand-o">O</span>Engine<span class="brand-domain">.ac</span></h1></a>
            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                <span class="icon">☀️</span>
                <span class="text">Light Mode</span>
            </button>
        </div>
    </header>

    <main class="container">
        <!-- Page Title & Mode -->
        <div class="builder-header">
            <h2>Video Prompt Builder</h2>
            <div class="mode-toggle-container">
                <div class="mode-slider">
                    <div class="mode-option active" data-mode="default">Default</div>
                    <div class="mode-option" data-mode="advanced">Advanced</div>
                    <div class="mode-option" data-mode="pro">Pro</div>
                </div>
                <div class="mode-knob"></div>
            </div>
        </div>

        <!-- Prompt Builder UI -->
        <section class="builder-line-container">
            <div id="builder-rows">
                <div class="builder-row" data-row-index="0">
                    <span class="builder-static">Create Prompt</span>

                    <select class="builder-dropdown category-select" aria-label="Select Category">
                        <option value="">Category</option>
                        <!-- Options populated via JS -->
                    </select>

                    <select class="builder-dropdown action-select hidden" aria-label="Select Action">
                        <option value="">Action</option>
                    </select>

                    <span class="helper-text hidden"></span>

                    <div class="intensity-wrapper hidden">
                        <label>Intensity: <span class="intensity-value">5</span></label>
                        <input type="range" min="1" max="10" value="5" class="intensity-slider">
                    </div>
                </div>
            </div>

            <button id="add-row-btn" class="add-btn" aria-label="Add field">+</button>
        </section>

        <!-- Action Area -->
        <div class="action-area">
            <div class="language-selector-wrapper">
                <label for="language-select">Output Language:</label>
                <select id="language-select" class="language-dropdown">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Hinglish">Hinglish</option>
                </select>
            </div>
            <button id="create-prompt-btn" class="create-btn">Create Prompt</button>
        </div>

        <!-- Output Area -->
        <section class="output-area">
            <div class="output-content">
                <p id="prompt-output">Your generated prompt will appear here...</p>
            </div>
            <button id="copy-btn" class="copy-btn hidden" aria-label="Copy Prompt">Copy</button>
        </section>

    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-branding">
                <p>&copy; 2025 AnmolCreation. Designed for thinking, not guessing.</p>
            </div>

            <div class="footer-feedback">
                <h4>Rate Your Experience</h4>
                <div class="feedback-form" id="feedback-form">
                    <div class="star-rating" id="star-rating">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>

                    <div class="feedback-details" id="feedback-details" style="display: none;">
                        <div class="feedback-category">
                            <label><input type="radio" name="feedback-category" value="Report Bug"> Bug</label>
                            <label><input type="radio" name="feedback-category" value="Feature Request"> Feature</label>
                            <label><input type="radio" name="feedback-category" value="Other" checked> Other</label>
                        </div>
                        <textarea id="feedback-message" placeholder="Tell us more..."></textarea>
                        <button id="feedback-submit" disabled>Send Feedback</button>
                    </div>
                </div>
                <div id="feedback-success" style="display: none;">
                    <p>Thank you for your feedback!</p>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="video.js"></script>
    <script type="module" src="../../assets/js/feedback.js"></script>
</body>
</html>
