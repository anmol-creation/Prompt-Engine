<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3565X5KNFD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3565X5KNFD');
    </script>
    <title>Video Prompt Builder - PromptoEngine</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/feedback.css">
    <!-- Base styles for the shell (can be shared or inline) -->
    <style>
        .mode-switcher-root {
            display: flex;
            justify-content: center;
            margin: 2rem 0;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .switch-btn {
            padding: 0.8rem 2rem;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .switch-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.3);
        }

        .switch-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #mode-content-container {
            min-height: 50vh;
        }
    </style>
</head>
<body class="dark-mode">
    <header>
        <div class="container header-content">
            <a href="../home/home.html" class="logo-link"><h1>Prompt<span class="brand-o">O</span>Engine<span class="brand-domain">.ac</span></h1></a>
            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                <span class="icon">☀️</span>
                <span class="text">Light Mode</span>
            </button>
        </div>
    </header>

    <main class="container">

        <!-- Unified Heading -->
        <h2 style="text-align:center; margin-bottom: 1rem;">Video Prompt Builder</h2>

        <!-- Mode Switcher -->
        <div class="mode-switcher-root">
            <button class="switch-btn active" data-target="simple">Simple Mode</button>
            <button class="switch-btn" data-target="advanced">Advanced Mode</button>
            <button class="switch-btn" data-target="pro">Pro Mode</button>
        </div>

        <!-- Dynamic Content Container -->
        <div id="mode-content-container">
            <!-- Content injected via JS -->
            <div class="loading-spinner">Loading...</div>
        </div>

    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-branding">
                <p>&copy; 2025 AnmolCreation. Designed for thinking, not guessing. <span class="ac-trigger" style="opacity: 0.05; cursor: default;">.ac</span></p>
            </div>

            <div class="footer-feedback">
                <h4>Rate Your Experience</h4>
                <div class="feedback-form" id="feedback-form">
                    <div class="star-rating" id="star-rating">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>

                    <div class="feedback-details" id="feedback-details" style="display: none;">
                        <div class="feedback-category">
                            <label><input type="radio" name="feedback-category" value="Report Bug"> Bug</label>
                            <label><input type="radio" name="feedback-category" value="Feature Request"> Feature</label>
                            <label><input type="radio" name="feedback-category" value="Other" checked> Other</label>
                        </div>
                        <textarea id="feedback-message" placeholder="Tell us more..."></textarea>
                        <button id="feedback-submit" disabled>Send Feedback</button>
                    </div>
                </div>
                <div id="feedback-success" style="display: none;">
                    <p>Thank you for your feedback!</p>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="video.js"></script>
    <script type="module" src="../../assets/js/feedback.js"></script>
</body>
</html>
